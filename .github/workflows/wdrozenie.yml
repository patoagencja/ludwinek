name: Wgrywanie na serwer

# Każdy push na main wgrywa public/ na serwer LH.pl (serwer534076) przez FTP z szyfrowaniem, a potem sprawdza stronę.
# Login i hasło FTP są w sekretach repo: FTP_USERNAME, FTP_PASSWORD.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: wgrywanie
  cancel-in-progress: false

jobs:
  wgraj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_HOST: serwer534076.lh.pl
      DOMENA: ludwinekaesthetic.pl
      IP: 195.2.223.12
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Wgraj public/ na serwer
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          S="set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30; set cmd:fail-exit true"
          ftp() { lftp --env-password -u "$FTP_USER" -e "$S; $1; bye" "ftp://$FTP_HOST"; }
          # konto FTP widzi albo /public_html (wtedy strona jest w podkatalogu domeny), albo od razu katalog domeny
          if ftp "cd $DOMENA" >/dev/null 2>&1; then T="$DOMENA"; else T="."; fi
          echo "Katalog strony na serwerze: $T"
          # kopia zmian zrobionych w panelu (/panel) przed wgraniem: leżą tylko na serwerze, wgrywanie ich nie rusza
          mkdir -p kopia-panelu
          ftp "cd $T; mirror --no-perms _panel-dane kopia-panelu/_panel-dane; mirror --no-perms img/p kopia-panelu/img-p" >/dev/null 2>&1 || true
          echo "Kopia panelu: $(find kopia-panelu -type f | wc -l) plików"
          ftp "cd $T; mirror -R --no-perms --parallel=4 --verbose=1 public/ ./"

      - name: Stripe (klucz na serwer i webhook)
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
          STRIPE_KEY_TEST: ${{ secrets.STRIPE_KEY_TEST }}
        run: |
          # Klucz z sekretów repo trafia tylko na serwer (_panel-dane/_stripe.php), razem z sekretem webhooka.
          # Webhook zakładamy przez API raz na klucz (odcisk klucza w pliku); bez klucza strona pokazuje „Vouchery wkrótce”.
          KEY="${STRIPE_KEY:-$STRIPE_KEY_TEST}"
          if [ -z "$KEY" ]; then echo "::notice::Brak klucza Stripe w sekretach (STRIPE_KEY): vouchery „wkrótce”"; exit 0; fi
          TRYB=live; [ -z "$STRIPE_KEY" ] && TRYB=test
          ODCISK=$(printf %s "$KEY" | sha256sum | cut -c1-16)
          if grep -q "$ODCISK" kopia-panelu/_panel-dane/_stripe.php 2>/dev/null; then echo "Stripe: konfiguracja aktualna (tryb $TRYB)"; exit 0; fi
          URL="https://$DOMENA/voucher/stripe"
          L=$(curl -s -u "$KEY:" "https://api.stripe.com/v1/webhook_endpoints?limit=100")
          if [ "$(echo "$L" | jq -r '.error.message // empty')" != "" ]; then echo "::error::Stripe: $(echo "$L" | jq -r .error.message)"; exit 1; fi
          for id in $(echo "$L" | jq -r --arg u "$URL" '.data[] | select(.url==$u) | .id'); do curl -s -u "$KEY:" -X DELETE "https://api.stripe.com/v1/webhook_endpoints/$id" >/dev/null; done
          R=$(curl -s -u "$KEY:" https://api.stripe.com/v1/webhook_endpoints -d url="$URL" -d "enabled_events[]=checkout.session.completed" \
              -d "enabled_events[]=checkout.session.async_payment_succeeded" -d description="ludwinekaesthetic.pl: vouchery")
          WH=$(echo "$R" | jq -r '.secret // empty')
          if [ -z "$WH" ]; then echo "::error::Stripe: nie udało się założyć webhooka: $(echo "$R" | jq -r '.error.message // .')"; exit 1; fi
          mkdir -p stripe
          K="$KEY" W="$WH" T="$TRYB" O="$ODCISK" php -r 'echo "<?php\n// zapisane przez wdrożenie (sekrety repo); nie edytować ręcznie\nreturn " . var_export(["klucz" => getenv("K"), "whsec" => getenv("W"), "tryb" => getenv("T"), "odcisk" => getenv("O")], true) . ";\n";' > stripe/_stripe.php
          printf 'Require all denied\n' > stripe/.htaccess
          S="set ftp:ssl-allow true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30; set cmd:fail-exit true"
          ftp() { lftp --env-password -u "$FTP_USER" -e "$S; $1; bye" "ftp://$FTP_HOST"; }
          if ftp "cd $DOMENA" >/dev/null 2>&1; then KAT="$DOMENA"; else KAT="."; fi
          ftp "cd $KAT; mkdir -p _panel-dane; cd _panel-dane; put stripe/_stripe.php -o _stripe.php; put stripe/.htaccess -o .htaccess"
          rm -rf stripe
          echo "::notice::Stripe skonfigurowany (tryb $TRYB), webhook: $URL"

      - name: Kopia zmian z panelu
        uses: actions/upload-artifact@v4
        with:
          name: kopia-panelu
          path: kopia-panelu
          retention-days: 90
          if-no-files-found: ignore

      - name: Sprawdź stronę
        run: |
          ok=1
          dns=$(getent hosts "$DOMENA" | awk '{print $1}' | head -1)
          echo "DNS $DOMENA → ${dns:-brak}"
          if [ "$dns" != "$IP" ]; then echo "::warning::Domena $DOMENA nie wskazuje jeszcze na serwer ($IP), tylko na: ${dns:-nic}. Sprawdzam serwer bezpośrednio."; fi
          R="--resolve $DOMENA:80:$IP --resolve $DOMENA:443:$IP --resolve www.$DOMENA:80:$IP"
          get() { curl -s $R --max-time 30 -o body.txt -D head.txt -w '%{http_code}' "$1" || echo 000; }
          c=$(get "http://www.$DOMENA/"); echo "www → $c $(grep -i '^location:' head.txt | tr -d '\r')"
          c=$(get "https://$DOMENA/"); echo "/ → $c"; grep -q "location.protocol" body.txt || { echo "::error::brak przekierowania http → https w stronie"; ok=0; }
          if [ "$c" = 200 ] && ! grep -q 'już wkrótce' body.txt && grep -q 'Ludwinek' body.txt; then echo "  pełna strona OK"; else echo "::error::Strona główna nie pokazuje pełnej strony (HTTP $c)"; ok=0; fi
          for a in modelowanie-ust zabiegi dermapen terapia-blizn-i-rozstepow zabiegi-pielegnacyjne event-glow signature-glow dla-mezczyzn blizny-potradzikowe cennik vouchery o-mnie informacje kontakt polityka-prywatnosci regulamin; do
            c=$(get "https://$DOMENA/$a"); [ "$c" = 200 ] || { echo "::error::/$a → $c"; ok=0; }
          done
          c=$(curl -s $R --max-time 30 -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Mobile' "https://$DOMENA/kontakt" || echo 000); echo "/kontakt na telefonie → $c"; [ "$c" = 200 ] || ok=0
          c=$(get "https://$DOMENA/sitemap.xml"); echo "/sitemap.xml → $c"; [ "$c" = 200 ] || { echo "::error::brak sitemap.xml"; ok=0; }
          c=$(curl -s $R --max-time 30 -o body.txt -w '%{http_code}' -X POST -d name=x -d t=5000 "https://$DOMENA/formularz" || echo 000); echo "/formularz (błędne dane, bez wysyłki) → $c"; [ "$c" = 422 ] && grep -q bledy body.txt || { echo "::error::formularz nie odpowiada poprawnie (HTTP $c)"; ok=0; }
          c=$(get "https://$DOMENA/panel"); echo "/panel → $c"; [ "$c" = 200 ] && grep -q 'Panel' body.txt || { echo "::error::panel nie działa (HTTP $c)"; ok=0; }
          c=$(get "https://$DOMENA/_panel-dane/_edycje.json"); echo "/_panel-dane bez logowania → $c"; [ "$c" = 403 ] || [ "$c" = 404 ] || { echo "::error::dane panelu dostępne publicznie (HTTP $c)"; ok=0; }
          c=$(get "https://$DOMENA/regulamin-voucherow"); echo "/regulamin-voucherow → $c"; [ "$c" = 200 ] || { echo "::error::regulamin voucherów nie działa (HTTP $c)"; ok=0; }
          c=$(curl -s $R --max-time 30 -o body.txt -w '%{http_code}' -X POST -d email=x "https://$DOMENA/voucher/zamow" || echo 000); echo "/voucher/zamow (błędne dane) → $c"; [ "$c" = 422 ] || [ "$c" = 503 ] || { echo "::error::zamówienie vouchera nie odpowiada poprawnie (HTTP $c)"; ok=0; }
          c=$(get "https://$DOMENA/_panel-dane/_stripe.php"); echo "/_panel-dane/_stripe.php → $c"; [ "$c" = 403 ] || [ "$c" = 404 ] || { echo "::error::konfiguracja Stripe dostępna publicznie (HTTP $c)"; ok=0; }
          c=$(get "https://$DOMENA/_strony/Home-Desktop.html"); echo "/_strony bez hasła → $c"; [ "$c" = 403 ] || { echo "::error::pliki stron dostępne bezpośrednio (HTTP $c)"; ok=0; }
          c=$(get "https://$DOMENA/assets/fonts.css"); echo "/assets/fonts.css → $c"; [ "$c" = 200 ] || { echo "::error::czcionki nie działają (HTTP $c)"; ok=0; }
          c=$(curl -s $R --max-time 30 -o /dev/null -w '%{http_code}' "https://$DOMENA/" || echo 000)
          if [ "$c" = 200 ]; then echo "::notice::https://$DOMENA działa (certyfikat SSL OK)"; else echo "::warning::https://$DOMENA nie działa (HTTP $c): włącz certyfikat SSL w LH.pl"; fi
          [ $ok = 1 ] && echo "::notice::Strona wgrana i sprawdzona" || exit 1
